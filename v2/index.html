<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ApumaMart V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f5f7fa;min-height:100vh}
.hidden{display:none!important}
/* Login */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1565C0,#0D47A1);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:40px 30px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-card h1{color:#1565C0;margin-bottom:5px;font-size:28px}
.login-card p{color:#666;margin-bottom:25px;font-size:14px}
.login-card input{width:100%;padding:14px;margin-bottom:12px;border:2px solid #e0e0e0;border-radius:12px;font-size:16px;outline:none}
.login-card input:focus{border-color:#1565C0}
.login-card button{width:100%;padding:14px;background:#1565C0;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.login-card button:hover{background:#0D47A1}
.login-card button:disabled{background:#90CAF9;cursor:not-allowed}
#loginErr{color:#c62828;margin-top:10px;font-size:14px;min-height:20px}
/* App */
#appPage{min-height:100vh}
.topbar{background:#1565C0;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.topbar h2{font-size:20px}
.topbar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:20px;max-width:800px;margin:0 auto}
.menu-card{background:#fff;border-radius:16px;padding:25px 15px;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:transform .2s}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 5px 20px rgba(0,0,0,.15)}
.menu-card .icon{font-size:40px;margin-bottom:10px}
.menu-card .label{font-weight:600;color:#333;font-size:14px}
/* Module pages */
.module{min-height:100vh;background:#f5f7fa}
.module-header{background:#1565C0;color:#fff;padding:15px 20px;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:100}
.module-header button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.module-body{padding:20px;max-width:800px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.btn{background:#1565C0;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
.btn-green{background:#2E7D32}.btn-orange{background:#EF6C00}.btn-red{background:#C62828}
.btn-block{width:100%;margin-top:10px}
input,select,textarea{width:100%;padding:12px;margin-bottom:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;outline:none}
input:focus{border-color:#1565C0}
.list-item{background:#fff;border-radius:10px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.loading{text-align:center;padding:40px;color:#666}
.err{color:#C62828;background:#FFEBEE;padding:12px;border-radius:8px;margin-bottom:15px}
.ok{color:#2E7D32;background:#E8F5E9;padding:12px;border-radius:8px;margin-bottom:15px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="login-card">
    <h1>🏪 ApumaMart</h1>
    <p>V2 — Naya System</p>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn" onclick="doLogin()">Login</button>
    <button onclick="doSignup()" style="background:#2E7D32;margin-top:10px">Naya Account Banao</button>
    <p id="loginErr"></p>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden">
  <div class="topbar">
    <h2>🏪 ApumaMart</h2>
    <button onclick="logout()">Logout</button>
  </div>
  <div class="grid" id="menuGrid"></div>
</div>

<!-- MODULE -->
<div id="modulePage" class="module hidden">
  <div class="module-header">
    <button onclick="showApp()">←</button>
    <h2 id="moduleTitle"></h2>
  </div>
  <div class="module-body" id="moduleBody"></div>
</div>

<script>
// ============ SUPABASE ============
const SB_URL = 'https://pyvjqmgzwymutbjwtoxg.supabase.co';
const SB_KEY = 'sb_publishable_ifcx8U2n-fRuRe1Z_Ew12w_IW37cEGe';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
let currentUser = null;

// ============ AUTH ============
async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('loginErr');
  if(!email || !password){ err.textContent = 'Email aur password dalo'; return; }
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) throw error;
    currentUser = data.user;
    showApp();
  }catch(e){ err.textContent = e.message; }
}
async function doSignup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const err = document.getElementById('loginErr');
  if(!email || !password){ err.textContent = 'Email aur password dalo'; return; }
  if(password.length < 6){ err.textContent = 'Password 6+ characters ka ho'; return; }
  try{
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error) throw error;
    err.style.color = '#2E7D32';
    err.textContent = 'Account ban gaya! Ab Login dabao.';
  }catch(e){ err.style.color = '#c62828'; err.textContent = e.message; }
}
async function logout(){
  await sb.auth.signOut();
  currentUser = null;
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}
// Check session on load
sb.auth.getSession().then(({data})=>{
  if(data.session){ currentUser = data.session.user; showApp(); }
});

// ============ MENU ============
const MENUS = [
  {icon:'🧾',label:'Naya Bill',fn:'bill'},
  {icon:'📦',label:'Products',fn:'products'},
  {icon:'📋',label:'Bill History',fn:'history'},
  {icon:'👥',label:'Customers',fn:'customers'},
  {icon:'🏭',label:'Suppliers',fn:'suppliers'},
  {icon:'💸',label:'Kharcha',fn:'expenses'},
  {icon:'👷',label:'Staff',fn:'staff'},
];
function showApp(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('modulePage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  document.getElementById('menuGrid').innerHTML = MENUS.map(m=>
    `<div class="menu-card" onclick="openModule('${m.fn}')"><div class="icon">${m.icon}</div><div class="label">${m.label}</div></div>`
  ).join('');
}
function openModule(fn){
  document.getElementById('appPage').classList.add('hidden');
  document.getElementById('modulePage').classList.remove('hidden');
  document.getElementById('moduleTitle').textContent = MENUS.find(m=>m.fn===fn).label;
  MODULES[fn]();
}

// ============ MODULES ============
const MODULES = {
  async products(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data, error } = await sb.from('products').select('*').eq('user_id', currentUser.id).order('name');
      if(error) throw error;
      b.innerHTML = `
        <div class="card"><h3>➕ Naya Product</h3>
          <input id="p_name" placeholder="Product naam">
          <input id="p_price" type="number" placeholder="Price ₹">
          <input id="p_stock" type="number" placeholder="Stock qty">
          <button class="btn btn-block" onclick="addProduct()">Save Karo</button>
        </div>
        <h3 style="margin:15px 0 10px">📦 Products (${data.length})</h3>
        ${data.map(p=>`<div class="list-item"><div><b>${p.name}</b><br>₹${p.price} | Stock: ${p.stock||0}</div></div>`).join('') || '<p style="color:#999">Koi product nahi</p>'}`;
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async bill(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data:products } = await sb.from('products').select('*').eq('user_id', currentUser.id).order('name');
      window._products = products || [];
      b.innerHTML = `
        <div class="card"><h3>🧾 Naya Bill</h3>
          <input id="b_customer" placeholder="Customer naam">
          <input id="b_phone" placeholder="Customer phone">
          <div id="billItems"></div>
          <select id="b_product">${(products||[]).map(p=>`<option value="${p.id}">${p.name} - ₹${p.price}</option>`).join('')}</select>
          <div style="display:flex;gap:10px">
            <input id="b_qty" type="number" value="1" min="1" style="flex:1">
            <button class="btn" onclick="addToBill()">+ Add</button>
          </div>
          <h3 id="billTotal" style="margin:15px 0">Total: ₹0</h3>
          <button class="btn btn-green btn-block" onclick="saveBill()">💾 Bill Save Karo</button>
        </div>`;
      window._billItems = [];
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async history(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data, error } = await sb.from('bills').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      b.innerHTML = `<h3>📋 Bill History (${data.length})</h3>` +
        (data.map(x=>`<div class="list-item"><div><b>${x.customer_name||'Customer'}</b><br>${new Date(x.created_at).toLocaleDateString('hi-IN')}</div><div><b>₹${x.total}</b></div></div>`).join('') || '<p style="color:#999">Koi bill nahi</p>');
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async customers(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data, error } = await sb.from('customers').select('*').eq('user_id', currentUser.id).order('name');
      if(error) throw error;
      b.innerHTML = `
        <div class="card"><h3>➕ Naya Customer</h3>
          <input id="c_name" placeholder="Naam"><input id="c_phone" placeholder="Phone">
          <button class="btn btn-block" onclick="addCustomer()">Save Karo</button></div>
        <h3 style="margin:15px 0 10px">👥 Customers (${data.length})</h3>
        ${data.map(c=>`<div class="list-item"><div><b>${c.name}</b><br>${c.phone||''}</div><div>Udhar: ₹${c.balance||0}</div></div>`).join('') || '<p style="color:#999">Koi customer nahi</p>'}`;
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async suppliers(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data, error } = await sb.from('suppliers').select('*').eq('user_id', currentUser.id).order('name');
      if(error) throw error;
      b.innerHTML = `
        <div class="card"><h3>➕ Naya Supplier</h3>
          <input id="s_name" placeholder="Naam"><input id="s_phone" placeholder="Phone">
          <button class="btn btn-block" onclick="addSupplier()">Save Karo</button></div>
        <h3 style="margin:15px 0 10px">🏭 Suppliers (${data.length})</h3>
        ${data.map(s=>`<div class="list-item"><div><b>${s.name}</b><br>${s.phone||''}</div><div>Baki: ₹${s.balance||0}</div></div>`).join('') || '<p style="color:#999">Koi supplier nahi</p>'}`;
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async expenses(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="loading">Load ho raha hai...</div>';
    try{
      const { data, error } = await sb.from('expenses').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false}).limit(50);
      if(error) throw error;
      const total = data.reduce((s,x)=>s+Number(x.amount||0),0);
      b.innerHTML = `
        <div class="card"><h3>➕ Naya Kharcha</h3>
          <input id="e_title" placeholder="Kis cheez ka kharcha">
          <input id="e_amount" type="number" placeholder="Amount ₹">
          <button class="btn btn-block" onclick="addExpense()">Save Karo</button></div>
        <h3 style="margin:15px 0 10px">💸 Total Kharcha: ₹${total}</h3>
        ${data.map(x=>`<div class="list-item"><div><b>${x.title}</b><br>${new Date(x.created_at).toLocaleDateString('hi-IN')}</div><div><b>₹${x.amount}</b></div></div>`).join('') || '<p style="color:#999">Koi kharcha nahi</p>'}`;
    }catch(e){ b.innerHTML = `<div class="err">${e.message}</div>`; }
  },
  async staff(){
    const b = document.getElementById('moduleBody');
    b.innerHTML = '<div class="card"><h3>👷 Staff</h3><p style="color:#666">Staff module jald aa raha hai!</p></div>';
  }
};

// ============ ACTIONS ============
async function addProduct(){
  const name = document.getElementById('p_name').value.trim();
  const price = Number(document.getElementById('p_price').value);
  const stock = Number(document.getElementById('p_stock').value) || 0;
  if(!name || !price){ alert('Naam aur price dalo'); return; }
  const { error } = await sb.from('products').insert({ user_id: currentUser.id, name, price, stock });
  if(error) alert(error.message); else MODULES.products();
}
function addToBill(){
  const pid = document.getElementById('b_product').value;
  const qty = Number(document.getElementById('b_qty').value) || 1;
  const p = window._products.find(x=>x.id===pid);
  if(!p) return;
  window._billItems.push({ product_id: p.id, name: p.name, price: p.price, qty });
  renderBill();
}
function renderBill(){
  const items = window._billItems;
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('billItems').innerHTML = items.map((i,idx)=>
    `<div class="list-item"><div>${i.name} x ${i.qty}</div><div>₹${i.price*i.qty} <button onclick="window._billItems.splice(${idx},1);renderBill()" style="color:red;border:none;background:none;cursor:pointer">✕</button></div></div>`
  ).join('');
  document.getElementById('billTotal').textContent = 'Total: ₹'+total;
}
async function saveBill(){
  const items = window._billItems;
  if(!items.length){ alert('Pehle items add karo'); return; }
  const total = items.reduce((s,i)=>s+i.price*i.qty,0);
  const customer_name = document.getElementById('b_customer').value.trim();
  const customer_phone = document.getElementById('b_phone').value.trim();
  const { error } = await sb.from('bills').insert({ user_id: currentUser.id, customer_name, customer_phone, items, total });
  if(error) alert(error.message);
  else { alert('Bill save ho gaya! ₹'+total); MODULES.bill(); }
}
async function addCustomer(){
  const name = document.getElementById('c_name').value.trim();
  const phone = document.getElementById('c_phone').value.trim();
  if(!name){ alert('Naam dalo'); return; }
  const { error } = await sb.from('customers').insert({ user_id: currentUser.id, name, phone });
  if(error) alert(error.message); else MODULES.customers();
}
async function addSupplier(){
  const name = document.getElementById('s_name').value.trim();
  const phone = document.getElementById('s_phone').value.trim();
  if(!name){ alert('Naam dalo'); return; }
  const { error } = await sb.from('suppliers').insert({ user_id: currentUser.id, name, phone });
  if(error) alert(error.message); else MODULES.suppliers();
}
async function addExpense(){
  const title = document.getElementById('e_title').value.trim();
  const amount = Number(document.getElementById('e_amount').value);
  if(!title || !amount){ alert('Title aur amount dalo'); return; }
  const { error } = await sb.from('expenses').insert({ user_id: currentUser.id, title, amount });
  if(error) alert(error.message); else MODULES.expenses();
}
</script>
</body>
</html>
